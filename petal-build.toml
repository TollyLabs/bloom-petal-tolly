schema = "bloom.petal.build.v1"
name = "tolly"
routes = "route/files"
output = "petal/tolly"

[route_crate]
package = "tolly-route"
path = "route"
alias = "tolly_route"

[sdk]
package = "bloom-petal-sdk"
git = "https://github.com/bloom-directory/petal"
rev = "73c5b06a77599368fbc79fb7947a629b5b4c630e"

# Route files reference only `petal::*` and `crate::*` (the shared route
# crate); every third-party crate lives in route/Cargo.toml.
