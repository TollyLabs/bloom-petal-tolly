schema = "bloom.petal.build.v1"
name = "tolly"
routes = "route/files"
output = "petal/tolly"

[route_crate]
package = "tolly-route"
path = "route"
alias = "tolly_route"

[sdk]
package = "bloom-petal-sdk"
git = "https://github.com/bloom-directory/petal"
rev = "73c5b06a77599368fbc79fb7947a629b5b4c630e"

# Crates route files reference directly. Everything else is reached through
# `crate::*` (the shared route crate) and lives in route/Cargo.toml.
[dependencies]
serde_json = "1"
