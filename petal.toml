schema = "bloom.petal.package.v1"
name = "tolly"

[build]
command = "scripts/build.sh"
outputs = ["petal/tolly"]

[consent]
summary = "Read TOLLY launchpad and DEX markets on Arc from the public production API (api.tollylabs.com), quote best execution across a token's venues, and stage buy, sell and token-launch transactions for the wallet owner to confirm in Bloom. The Petal never signs and never broadcasts; every transaction is confirmed by the owner in Bloom's outbox with their passkey."

[caps]
allowed = ["bloom:http", "bloom:store", "bloom:tx.outbox", "bloom:chain", "bloom:vfs.read"]

# PRODUCTION API host: the default network (`tolly_network` unset or "prod").
# Paths are matched on the URL path only (query strings are not part of the
# rule): GET /health, GET /tokens?..., GET /token/<address>. The binding lets
# an operator re-point the HTTPS authority only; methods and paths stay.
[[net.allow]]
binding = "tolly-prod"
host = "api.tollylabs.com"
methods = ["GET"]
paths = ["/health", "/tokens", "/token/*"]

# STAGE API host: the team's test site, reached only when the owner sets
# `tolly_network = "stage"` under [petals.runtime.tolly.values]. Same paths
# under the /api prefix. Both hosts index Arc mainnet.
[[net.allow]]
binding = "tolly-stage"
host = "stage.tollylabs.com"
methods = ["GET"]
paths = ["/api/health", "/api/tokens", "/api/token/*"]

[store]
namespaces = ["state"]
