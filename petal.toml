schema = "bloom.petal.package.v1"
name = "tolly"

[build]
command = "scripts/build.sh"
outputs = ["petal/tolly"]

[consent]
summary = "Read TOLLY launchpad and DEX markets on Arc, quote best execution across a token's venues, and stage buy, sell and token-launch transactions for the wallet owner to confirm in Bloom. The Petal never signs and never broadcasts; every transaction is confirmed by the owner in Bloom's outbox."

[caps]
allowed = ["bloom:http", "bloom:store", "bloom:tx.outbox", "bloom:chain", "bloom:vfs.read"]

# STAGE API host (day-1). The binding only lets an operator re-point the
# HTTPS authority; the path policy below stays, so it is NOT a prod switch.
# Prod (api.tollylabs.com, no /api prefix) ships as a separate manifest release.
[[net.allow]]
binding = "tolly-stage"
host = "stage.tollylabs.com"
methods = ["GET"]
paths = ["/api/health", "/api/tokens", "/api/token/*"]

[store]
namespaces = ["state"]
